[project]
name = "bell-settlement"
version = "0.1.0"
description = "BELL settlement reference service: route evaluation and challenge adjudication"
requires-python = ">=3.12"
# The shared domain core. Artifacts 2 and 3 share it, and the dependency runs one way only: the
# calibrator must never import from this package (build brief §4.2). Declared as a path dependency
# because the two live in one repository and version together (§6).
dependencies = [
  "bell-calibrator",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "mypy==2.3.1",
  "ruff==0.16.7",
  "pycryptodome==3.23.0",
  "pyyaml==6.0.3",
  "import-linter==2.15",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# --------------------------------------------------------------------------- type checking

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = true
files = ["src", "tests"]
# Both workspaces are path dependencies within one repository, so mypy has to be told where the
# shared core lives. Without this it resolves `bell_calibrator` as an installed package with no
# `py.typed` marker and reports every import of it as untyped.
mypy_path = ["src", "../calibrator/src"]

# The contract tests read JSON fixtures, and a JSON decode is `Any` by construction.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_any_explicit = false

# --------------------------------------------------------------------------- linting

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "ANN", "B", "A", "C4", "DTZ", "T20", "SIM", "PTH", "RUF",
]
ignore = [
  # `Decimal` is the domain's numeric type and ruff's default is to prefer the builtin `float`. The
  # brief forbids `float` in the domain, so the suggestion is inverted here.
  "RUF046",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201"]

# --------------------------------------------------------------------------- architecture

[tool.importlinter]
root_package = "bell_settlement"
# Required because the domain contract forbids *external* packages as well as the sibling layers.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain depends on nothing but the standard library, the shared core and itself"
type = "forbidden"
source_modules = ["bell_settlement.domain"]
forbidden_modules = [
  "bell_settlement.application",
  "bell_settlement.adapters",
  "Crypto",
  "requests",
  "web3",
  "yaml",
]

[[tool.importlinter.contracts]]
name = "application does not import adapters"
type = "forbidden"
source_modules = ["bell_settlement.application"]
forbidden_modules = ["bell_settlement.adapters"]

[[tool.importlinter.contracts]]
name = "the layer stack"
type = "layers"
layers = [
  "bell_settlement.adapters",
  "bell_settlement.application",
  "bell_settlement.domain",
]

[[tool.importlinter.contracts]]
name = "the calibrator never imports the settlement service"
type = "forbidden"
source_modules = ["bell_calibrator"]
forbidden_modules = ["bell_settlement"]

# --------------------------------------------------------------------------- coverage

[tool.coverage.run]
source = ["src"]
branch = true

# What is excluded, and why each one is not a path a test could take:
#
#   `...`              a `Protocol` method body. A protocol is a declaration, never instantiated and
#                      never called, so its body is not executable code. Counting it makes every
#                      ports module read as uncovered and hides the modules that are.
#   `if TYPE_CHECKING` an import guard, which by construction does not run at runtime.
#   `raise NotImplementedError` and `@overload`  the same argument as `...`.
#
# Excluding these is not a way to raise a number. Each is a declaration that no input can reach, and
# the alternative -- a `# pragma: no cover` on every protocol method -- would put the same
# justification in twenty places instead of one.
[tool.coverage.report]
exclude_also = [
  '\.\.\.',
  'if TYPE_CHECKING:',
  'raise NotImplementedError',
  '@overload',
]
